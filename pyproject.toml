[project]
name = "sensoriq-monitor"
version = "0.1.0"
description = "Read-only dashboard for ETC SensorIQ panels with live circuit status pushed to Grist"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    "pydantic-settings==2.6.1",
    "ruamel.yaml==0.18.6",
    "fpdf2==2.9.0",
    "tzdata",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
